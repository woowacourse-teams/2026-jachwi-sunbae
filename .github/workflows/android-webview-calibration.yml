name: Android WebView Calibration

# PR마다 도는 Visual Verdict는 데스크탑 Chromium에 보통 4G와 CPU 4배 제한을 건 흉내 환경에서 잰다.
# 이 워크플로는 같은 실행 안에서 그 흉내 값과 안드로이드 에뮬레이터의 크롬, 앱 웹뷰(같은 설정의 셸) 값을 한 표로 비교한다.
# 앱 웹뷰에서는 시나리오 여섯(android-scenarios.mjs)을 재고 이력에 쌓아 직전 실행, 최근 4회와 비교한다. 이상이 의심되면 같은 러너에서
# 이전 커밋과 이번 커밋을 번갈아 다시 재서 확인하고(calibration-judge.mjs), 확인된 것만 이슈 후보로 이력 브랜치에 남긴다.
# 이슈 게시는 이 워크플로가 하지 않는다. 소유자 환경에서 perf-issue.mjs 가 한다. 여기서는 dry-run 만 보인다.
# 자세한 흐름: frontend/docs/android-webview-calibration.md
# - 주 1회와 수동 실행(workflow_dispatch, 기본 브랜치 develop에 이 파일이 있어야 보인다). 에뮬레이터를 띄워 오래 걸려 PR마다는 돌리지 않는다.
# - 이력: 주 1회 실행만 운영 이력(calibration-history 브랜치)에 쓴다. 수동 실행은 기본이 시험 이력(calibration-history-test)이고,
#   develop에서 history=prod 를 고를 때만 운영 이력에 쓴다. 시험 실행이 운영 이력에 섞이지 않게 하려는 것이다.
# - 결과: 실행 요약(표)과 아티팩트 android-webview-calibration. 판정이 아니라 참고 값이라 실패로 막지 않는다.
on:
  # 임시: PR 브랜치에서 시험 이력으로 한 번 돌려 보려는 트리거. 머지 준비 때 지운다.
  push:
    branches: [chore/android-webview-calibration]
  workflow_dispatch:
    inputs:
      history:
        description: '이력 채널. prod 는 develop 에서만 쓸 수 있다'
        type: choice
        options: [test, prod]
        default: test
      confirm:
        description: '다시 재기. auto 는 의심될 때만, always 는 시험용으로 늘 cold 와 register 를 이전 커밋과 다시 잰다'
        type: choice
        options: [auto, always, never]
        default: auto
  schedule:
    # 매주 월요일 0:00 KST(UTC 일요일 15:00). schedule은 기본 브랜치(develop)의 이 파일로 돌아 develop을 잰다.
    - cron: '0 15 * * 0'

permissions:
  contents: read

# 시험 실행이 주 1회 실행을 중간에 끊지 않게 앞 실행이 끝나기를 기다린다.
concurrency:
  group: android-webview-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    name: Android WebView calibration
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      # 이력 브랜치(calibration-history, calibration-history-test)에 기록을 올린다.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
          # 이력 push 는 아래에서 토큰을 직접 준다.
          persist-credentials: false

      - name: Decide history channel
        id: channel
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.history }}
          REF: ${{ github.ref }}
        run: |
          channel=test
          if [[ "${EVENT}" == schedule ]]; then channel=prod; fi
          if [[ "${EVENT}" == workflow_dispatch && "${REQUESTED}" == prod ]]; then
            [[ "${REF}" == refs/heads/develop ]] || { echo "::error::운영 이력(prod)은 develop 에서만 쓴다: ${REF}"; exit 1; }
            channel=prod
          fi
          branch=calibration-history
          [[ "${channel}" == prod ]] || branch=calibration-history-test
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "이력 채널: ${channel} (${branch}), 커밋 $(git rev-parse --short HEAD)"

      # 판정이 측정 중에 이력과 견주므로 에뮬레이터를 띄우기 전에 이력 브랜치를 받는다. 조건 지문(env.json)도 미리 쓴다.
      - name: Load history
        env:
          BRANCH: ${{ steps.channel.outputs.branch }}
        run: |
          H="${RUNNER_TEMP}/history"
          mkdir -p "${RUNNER_TEMP}/calibration"
          cat > "${RUNNER_TEMP}/calibration/env.json" <<EOF
          {"runner": "${ImageOS:-ubuntu} ${ImageVersion:-}", "emulator": "API 35 google_apis x86_64 pixel_6, swiftshader", "mockDelay": 300, "mapSdk": "stub", "cache": "prod"}
          EOF
          git init -q "${H}"
          if git -C "${H}" fetch -q --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${BRANCH}"; then
            git -C "${H}" checkout -q -B "${BRANCH}" FETCH_HEAD
          else
            echo "${BRANCH} 브랜치가 없어 첫 기록으로 만든다."
            git -C "${H}" checkout -q --orphan "${BRANCH}"
          fi

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Restore QA dependencies
        id: qa-modules
        uses: actions/cache@v5
        with:
          path: qa/node_modules
          key: qa-node-modules-${{ runner.os }}-${{ hashFiles('qa/package-lock.json') }}

      - name: Build web and shell app
        env:
          QA_CACHED: ${{ steps.qa-modules.outputs.cache-hit }}
          # Visual Verdict와 같다. 지도 키가 없어 아무 키나 넣고 SDK 주소는 목 서버로 돌린다.
          NAVER_MAP_CLIENT_ID: ci-map-sdk-stub
          API_BASE_URL: http://localhost:4302
        run: |
          pids=()
          (cd frontend && npm run build:bundle --silent > "${RUNNER_TEMP}/build.log" 2>&1) & pids+=($!)
          if [[ "${QA_CACHED}" != 'true' ]]; then (cd qa && npm ci --no-audit --no-fund --loglevel=error) & pids+=($!); fi
          (sudo apt-get install -y -qq --no-install-recommends fonts-nanum > /dev/null 2>&1 \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-nanum > /dev/null)) & pids+=($!)
          .claude/skills/verify-jachwi/android/webview-shell/build.sh "${RUNNER_TEMP}/webview-shell.apk" & pids+=($!)
          for pid in "${pids[@]}"; do wait "${pid}" || { tail -40 "${RUNNER_TEMP}/build.log"; exit 1; }; done

      - name: Start servers
        run: |
          S=.claude/skills/verify-jachwi/scripts
          nohup node "$S/serve.mjs" --dist frontend/dist --port 4302 --api mock --delay 300 --cache prod --faults > "${RUNNER_TEMP}/serve.log" 2>&1 &
          nohup node "$S/map-sdk-stub.mjs" --port 4443 > "${RUNNER_TEMP}/map-sdk-stub.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://localhost:4302/ > /dev/null && break; sleep 0.5; done
          for _ in $(seq 60); do curl -skf https://localhost:4443/openapi/v3/maps-gl.js -o /dev/null && break; sleep 0.5; done

      # 에뮬레이터를 띄우기 전에 잰다. 떠 있는 에뮬레이터가 러너 CPU를 나눠 쓰면 흉내 값이 PR 판정과 달라진다.
      - name: Measure Chromium emulation
        run: |
          S=.claude/skills/verify-jachwi/scripts
          OUT="${RUNNER_TEMP}/calibration"
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          # desktop: PR 판정과 같은 조건(--screen home, 주소 /). mobile: 휴대폰 폭 홈은 기본이 지도 보기라
          # 에뮬레이터 두 경로와 같이 목록 보기(/?view=list)로 열어 같은 순간(article img)을 잰다.
          for viewport in desktop mobile; do
            if [[ "${viewport}" == desktop ]]; then target=(--screen home); else target=(--path '/?view=list' --selector 'article img'); fi
            before=$(grep -c '^request ' "${RUNNER_TEMP}/map-sdk-stub.log" || true)
            node "$S/measure.mjs" --before http://localhost:4302 --after http://localhost:4302 "${target[@]}" \
              --viewport "${viewport}" --net fast4g --runs 5 --extra-runs 0 --map-sdk stub --max-load 0 --out "${OUT}/${viewport}"
            after=$(grep -c '^request ' "${RUNNER_TEMP}/map-sdk-stub.log" || true)
            echo $((after - before)) > "${OUT}/${viewport}/stub-hits.txt"
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HISTORY_DIR: ${{ runner.temp }}/history
          CHANNEL: ${{ steps.channel.outputs.channel }}
          COMMIT: ${{ steps.channel.outputs.commit }}
          CONFIRM_MODE: ${{ inputs.confirm || (github.event_name == 'push' && 'always') || 'auto' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: .claude/skills/verify-jachwi/android/run-on-emulator.sh "${RUNNER_TEMP}/webview-shell.apk" "${RUNNER_TEMP}/calibration" "${RUNNER_TEMP}/map-sdk-stub.log" 5

      - name: Summarize
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .claude/skills/verify-jachwi/scripts/calibration-report.mjs --dir "${RUNNER_TEMP}/calibration" --run-url "${RUN_URL}" \
            && cat "${RUNNER_TEMP}/calibration/calibration.md" >> "${GITHUB_STEP_SUMMARY}"
          cp "${RUNNER_TEMP}"/*.log "${RUNNER_TEMP}/calibration/" 2>/dev/null || true

      # 웹뷰 측정이 돌았을 때만 이력과 판정을 쓴다. 측정 전에 실패한 실행은 기록하지 않는다. 같은 실행을 다시 기록해도 줄을 더하지 않는다.
      - name: Record history and judge
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          BRANCH: ${{ steps.channel.outputs.branch }}
          COMMIT: ${{ steps.channel.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          S=.claude/skills/verify-jachwi/scripts
          OUT="${RUNNER_TEMP}/calibration"
          H="${RUNNER_TEMP}/history"
          if [[ ! -f "${OUT}/webview/result.json" ]]; then echo '웹뷰 측정 결과가 없어 이력에 쓰지 않는다.'; exit 0; fi
          node "$S/calibration-history.mjs" --dir "${OUT}" --history "${H}" \
            --channel "${CHANNEL}" --commit "${COMMIT}" --ref "${GITHUB_REF}" --event "${GITHUB_EVENT_NAME}" \
            --run-url "${RUN_URL}" --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" --env-file "${OUT}/env.json"
          node "$S/calibration-judge.mjs" finalize --dir "${OUT}" --history "${H}" --channel "${CHANNEL}" --event "${GITHUB_EVENT_NAME}"
          cat "${OUT}/history.md" "${OUT}/verdict.md" >> "${GITHUB_STEP_SUMMARY}"
          cp "${H}/android-webview/SUMMARY.md" "${OUT}/history-summary.md"
          cp "${H}/android-webview/issues.json" "${OUT}/issues.json"
          git -C "${H}" add -A
          if git -C "${H}" diff --cached --quiet; then
            echo '이력에 바뀐 것이 없다.'
          else
            git -C "${H}" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "chore: 안드로이드 웹뷰 보정 기록을 더한다 (${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}, ${COMMIT:0:8})"
            git -C "${H}" push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          fi
          echo "이력: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${BRANCH}/android-webview/SUMMARY.md" >> "${GITHUB_STEP_SUMMARY}"

      # 게시는 하지 않는다. 이번 이력의 후보와 합성 장애로 생성, 중복, 무시 갈래만 보인다. 팀 워크플로 안에서는 --publish 를 스크립트가 거부한다.
      - name: Issue dry-run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S=.claude/skills/verify-jachwi/scripts
          F=.claude/skills/verify-jachwi/fixtures
          OUT="${RUNNER_TEMP}/calibration"
          if [[ -d "${RUNNER_TEMP}/history/android-webview" ]]; then
            node "$S/perf-issue.mjs" --source "${RUNNER_TEMP}/history" --out "${OUT}/issue-plan.md"
            cat "${OUT}/issue-plan.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          node "$S/perf-issue.mjs" --candidates "$F/perf-issue-synthetic.json" --existing-keys "$F/perf-issue-existing-keys.json" \
            --out "${OUT}/issue-plan-synthetic.md" > "${OUT}/issue-plan-synthetic.log"
          tail -1 "${OUT}/issue-plan-synthetic.log" | grep -q '"create".*"duplicate".*"ignore"' \
            || { echo '::error::합성 장애 dry-run 갈래가 생성, 중복, 무시가 아니다'; cat "${OUT}/issue-plan-synthetic.log"; exit 1; }
          { echo; echo '### 합성 장애 dry-run'; cat "${OUT}/issue-plan-synthetic.md"; } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload calibration
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-webview-calibration
          path: ${{ runner.temp }}/calibration
          retention-days: 30
          if-no-files-found: ignore
