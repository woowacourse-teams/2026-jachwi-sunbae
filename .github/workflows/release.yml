name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: metadata
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "릴리스는 main 브랜치에서만 실행할 수 있다: ${GITHUB_REF}" >&2
            exit 1
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python3 .github/scripts/check_versions.py
          python3 .github/scripts/check_changelog.py "${VERSION}" > "${NOTES_FILE}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          TAG="v${VERSION}"
          if git rev-parse "${TAG}^{commit}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_SHA}" != "${GITHUB_SHA}" ]]; then
              echo "${TAG} 태그가 다른 커밋을 가리킨다: ${TAG_SHA}" >&2
              exit 1
            fi
          else
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release가 이미 존재한다: ${TAG}"
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file "${NOTES_FILE}"
          fi
