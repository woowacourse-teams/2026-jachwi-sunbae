name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API_BASE_URL: http://localhost:8080
  POSTHOG_PROJECT_TOKEN: ci-example-posthog-token
  POSTHOG_HOST: https://us.i.posthog.com

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check repository version
        run: python3 .github/scripts/check_versions.py

      - name: Check changelog
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python3 .github/scripts/check_changelog.py "${VERSION}"

      - name: Detect frontend changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "frontend=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          else
            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          if grep -Eq '^(frontend/|\.github/workflows/frontend-ci\.yml$|\.github/actions/setup-frontend/)' <<< "${CHANGED_FILES}"; then
            echo "frontend=true" >> "${GITHUB_OUTPUT}"
          else
            echo "frontend=false" >> "${GITHUB_OUTPUT}"
            echo "프론트엔드 변경이 없어 검사를 생략한다." >> "${GITHUB_STEP_SUMMARY}"
          fi

  static:
    name: Lint, format, typecheck
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Test
        run: npm run test

  build:
    name: Build frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      # 타입 검사는 static job이 맡으므로 번들만 만든다.
      - name: Build bundle
        run: npm run build:bundle

  check:
    # 필수 상태 검사 이름이다. 이름을 바꾸면 rulesets의 필수 검사도 같이 바꿔야 한다.
    name: Check frontend
    needs: [changes, static, test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Collect frontend results
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes=${CHANGES} static=${STATIC} test=${TEST} build=${BUILD}"

          if [[ "${CHANGES}" != "success" ]]; then
            echo "::error::버전, changelog 검사나 변경 감지가 실패했다."
            exit 1
          fi

          if [[ "${FRONTEND}" != "true" ]]; then
            echo "프론트엔드 변경이 없어 검사를 생략한다."
            exit 0
          fi

          if [[ "${STATIC}" != "success" || "${TEST}" != "success" || "${BUILD}" != "success" ]]; then
            echo "::error::프론트엔드 검사 중 실패하거나 취소된 job이 있다."
            exit 1
          fi

  mutation:
    name: Mutation test changed logic
    # 바뀐 로직 파일에만 뮤테이션 테스트를 돌려 살아남은 변이를 리뷰 입력으로 남긴다.
    # 점수는 병합 조건이 아니라서 실패해도 PR을 막지 않는다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 대상 판정은 의존성 없이 돌아가므로 설치 전에 끝내고, 대상이 없으면 설치도 건너뛴다.
      - name: Detect changed logic files
        id: changes
        env:
          MUTATION_BASE: origin/${{ github.base_ref }}
        run: |
          TARGETS="$(node scripts/mutation-changed.mjs "${MUTATION_BASE}" --list)"
          if [[ -n "${TARGETS}" ]]; then
            echo "logic=true" >> "${GITHUB_OUTPUT}"
            printf '뮤테이션 대상:\n%s\n' "${TARGETS}"
          else
            echo "logic=false" >> "${GITHUB_OUTPUT}"
            echo "바뀐 로직 파일이 없어 뮤테이션 테스트를 생략한다." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Set up frontend
        if: steps.changes.outputs.logic == 'true'
        uses: ./.github/actions/setup-frontend

      - name: Restore incremental mutation report
        if: steps.changes.outputs.logic == 'true'
        uses: actions/cache@v5
        with:
          path: frontend/reports/mutation/incremental.json
          key: mutation-incremental-${{ github.head_ref }}-${{ github.sha }}
          restore-keys: |
            mutation-incremental-${{ github.head_ref }}-
            mutation-incremental-${{ github.base_ref }}-

      - name: Run mutation tests on changed logic files
        if: steps.changes.outputs.logic == 'true'
        env:
          MUTATION_BASE: origin/${{ github.base_ref }}
        run: node scripts/mutation-changed.mjs "${MUTATION_BASE}" 2>&1 | tee mutation.log

      - name: Write mutation summary
        if: steps.changes.outputs.logic == 'true' && always()
        run: |
          {
            echo "## 뮤테이션 테스트 결과"
            echo
            echo '```text'
            sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' mutation.log | grep -vE '^\s*$|Mutation testing +\[' | tail -n 120
            echo '```'
            echo
            echo "살아남은 변이는 테스트가 잡지 못한 동작 변경이다. HTML 보고서는 workflow artifacts에서 받을 수 있다."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload mutation report
        if: steps.changes.outputs.logic == 'true' && always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-report
          path: frontend/reports/mutation/index.html
          if-no-files-found: ignore
