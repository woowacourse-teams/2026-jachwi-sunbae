name: Mobile CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect mobile changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "mobile=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          else
            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          if grep -Eq '^(mobile/|frontend/src/app/layouts/property-app-layout/|frontend/src/shared/lib/native-app/|frontend/test/app/layouts/property-app-layout/|frontend/test/shared/lib/native-app/|\.github/workflows/mobile-ci\.yml$)' <<< "${CHANGED_FILES}"; then
            echo "mobile=true" >> "${GITHUB_OUTPUT}"
          else
            echo "mobile=false" >> "${GITHUB_OUTPUT}"
          fi
        working-directory: .

      - name: Report skipped mobile check
        if: steps.changes.outputs.mobile != 'true'
        run: echo "모바일 변경이 없어 검사를 생략한다."
        working-directory: .

      - name: Set up Node.js
        if: steps.changes.outputs.mobile == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.x"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.mobile == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.mobile == 'true'
        run: npm run lint

      - name: Test
        if: steps.changes.outputs.mobile == 'true'
        run: npm test -- --runInBand
