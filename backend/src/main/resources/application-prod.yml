spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE:REQUIRED}&connectionTimeZone=%2B00:00&forceConnectionTimeZoneToSession=true&preserveInstants=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 80

logging:
  level:
    root: info
  file:
    path: ${LOG_PATH:/var/log/jachwi-sunbae}
  structured:
    ecs:
      service:
        environment: ${DEPLOYMENT_ENVIRONMENT:unknown}

auth:
  jwt:
    secret: ${JWT_SECRET}

promotion:
  collection:
    enabled: true

weather:
  collection:
    enabled: true
  cleanup:
    enabled: true
  notification:
    # 기존 스토어 2.1.1(8)의 프로젝트. 실제 ADC/APNs·실기기 확인 후 별도로 활성화한다.
    enabled: false
    schedule-enabled: false
    firebase-project-id: "jachwi-sunbae-de"
